name: iOSBuild

# Release workflow から版を渡されて呼ばれる。手動実行はビルドが通るかの確認用で、版は書き込まない。
# App Store Connect の API キー(APPLE_API_*)があれば Xcode の自動署名で App Store 向けの ipa を作り、無ければ署名せずに作る。
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # ----------------------
      # Node / pnpm
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - run: pnpm install

      # ----------------------
      # Rust
      # ----------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ----------------------
      # App Store Connect API key
      # ----------------------
      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::notice::APPLE_API_* が無いので署名せずにビルドする"
            exit 0
          fi
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          mkdir -p "$(dirname "$key")"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      # ----------------------
      # build
      # ----------------------
      # release ブランチのスナップショットと同じ値を書き込む。jq で書き直すと tauri.conf.json の整形が崩れるので sed で置き換える
      - name: Stamp version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' app/package.json > app/package.json.tmp
          mv app/package.json.tmp app/package.json
          sed -i '' -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$VERSION\"/" src-tauri/tauri.conf.json
          jq -e --arg v "$VERSION" '.version == $v' src-tauri/tauri.conf.json
          # 通知拡張の版は親アプリと揃っている必要があるが、Tauri は本体の Info.plist しか書き換えない
          plutil -replace CFBundleShortVersionString -string "$VERSION" src-tauri/gen/apple/NotifyService/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" src-tauri/gen/apple/NotifyService/Info.plist

      - run: pnpm build

      - name: Build iOS
        run: |
          if [ -n "$APPLE_API_KEY" ]; then
            pnpm tauri ios build --ci --export-method app-store-connect
          else
            pnpm tauri ios build --ci --no-sign
          fi

      # ----------------------
      # artifact
      # ----------------------
      - uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ inputs.version || github.sha }}
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
