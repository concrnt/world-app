name: iOSBuild

# Release workflow から版を渡されて呼ばれる。手動実行はビルドが通るかの確認用で、版は書き込まない。
# 配布証明書とプロファイル(APPLE_DISTRIBUTION_P12・APPLE_PROFILE_*)で App Store 向けに署名した ipa を作る。
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # ----------------------
      # Node / pnpm
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - run: pnpm install

      # ----------------------
      # Rust
      # ----------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ----------------------
      # signing
      # ----------------------
      # API キーを Tauri に渡すと Xcode の自動署名(cloud signing とプロファイル作成)になり、Admin でないキーでは書き出せない。
      # IOS_CERTIFICATE などの Tauri の変数は本体しか手動署名にせず NotifyService が署名できないので、
      # Xcode プロジェクトと ExportOptions を直接書き換えて両方を手動署名にする
      - name: Install signing assets
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP }}
          PROFILE_NOTIFY: ${{ secrets.APPLE_PROFILE_NOTIFY }}
        run: |
          team=X28AUB639J

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

          install_profile() {
            local file="$RUNNER_TEMP/$2.mobileprovision" app_id uuid
            printf '%s' "$1" | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$2.plist"
            app_id=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/$2.plist")
            if [ "$app_id" != "$team.$2" ]; then
              echo "the profile given for $2 is for $app_id" >&2
              return 1
            fi
            uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/$2.plist")
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.mobileprovision"
            done
            echo "$uuid"
          }
          APP_UUID=$(install_profile "$PROFILE_APP" world.concrnt.app)
          NOTIFY_UUID=$(install_profile "$PROFILE_NOTIFY" world.concrnt.app.NotifyService)
          export APP_UUID NOTIFY_UUID

          python3 - <<'EOF'
          import os, re
          path = 'src-tauri/gen/apple/world-app.xcodeproj/project.pbxproj'
          profiles = {'world.concrnt.app': os.environ['APP_UUID'], 'world.concrnt.app.NotifyService': os.environ['NOTIFY_UUID']}
          patched = []
          def patch(m):
              block = m.group(0)
              bundle_id = re.search(r'PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);', block)
              if 'name = release;' not in block or not bundle_id or bundle_id.group(1) not in profiles:
                  return block
              patched.append(bundle_id.group(1))
              settings = (
                  '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
                  '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
                  f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {profiles[bundle_id.group(1)]};\n'
              )
              return block.replace('buildSettings = {\n', 'buildSettings = {\n' + settings, 1)
          text = re.sub(r'\t\t[0-9A-F]{24} /\* release \*/ = \{\n.*?\n\t\t\};\n', patch, open(path).read(), flags=re.S)
          assert sorted(patched) == sorted(profiles), patched
          open(path, 'w').write(text)
          EOF

          plist=src-tauri/gen/apple/ExportOptions.plist
          plutil -replace signingStyle -string manual "$plist"
          plutil -replace signingCertificate -string "Apple Distribution" "$plist"
          plutil -replace provisioningProfiles -json "{\"world.concrnt.app\":\"$APP_UUID\",\"world.concrnt.app.NotifyService\":\"$NOTIFY_UUID\"}" "$plist"

      # ----------------------
      # build
      # ----------------------
      # release ブランチのスナップショットと同じ値を書き込む。jq で書き直すと tauri.conf.json の整形が崩れるので sed で置き換える
      - name: Stamp version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' app/package.json > app/package.json.tmp
          mv app/package.json.tmp app/package.json
          sed -i '' -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$VERSION\"/" src-tauri/tauri.conf.json
          jq -e --arg v "$VERSION" '.version == $v' src-tauri/tauri.conf.json
          # 通知拡張の版は親アプリと揃っている必要があるが、Tauri は本体の Info.plist しか書き換えない
          plutil -replace CFBundleShortVersionString -string "$VERSION" src-tauri/gen/apple/NotifyService/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" src-tauri/gen/apple/NotifyService/Info.plist

      - run: pnpm build

      - name: Build iOS
        run: pnpm tauri ios build --ci --export-method app-store-connect

      # ----------------------
      # artifact
      # ----------------------
      - uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ inputs.version || github.sha }}
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
