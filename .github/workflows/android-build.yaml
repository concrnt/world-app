name: AndroidBuild

# Release workflow から版を渡されて呼ばれる。手動実行はビルドが通るかの確認用で、版は書き込まない
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      version-code:
        type: string
        required: true
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}

      # ----------------------
      # Node / pnpm
      # ----------------------
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # pnpm cache
      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install

      # ----------------------
      # Rust
      # ----------------------
      - uses: dtolnay/rust-toolchain@stable

      # Rust cache
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      # ----------------------
      # Android
      # ----------------------
      # ランナーの既定 JDK が 25 になり、Gradle 8.14.3(Java 24 まで)が起動できなくなったため固定する
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      # Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ----------------------
      # Inject keystore
      # ----------------------
      - name: Restore keystore
        run: |
          mkdir -p src-tauri/gen/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/app/keystore.jks

      - name: Create keystore.properties
        run: |
          cat <<EOF > src-tauri/gen/android/keystore.properties
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=keystore.jks
          EOF

      # ----------------------
      # build
      # ----------------------
      # release ブランチのスナップショットと同じ値を書き込む。jq で書き直すと tauri.conf.json の整形が崩れるので sed で置き換える
      - name: Stamp version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.version-code }}
        run: |
          jq --arg v "$VERSION" '.version = $v' app/package.json > app/package.json.tmp
          mv app/package.json.tmp app/package.json
          sed -i -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$VERSION\"/; s/(\"versionCode\": )[0-9]+/\1$CODE/" src-tauri/tauri.conf.json
          jq -e --arg v "$VERSION" --argjson c "$CODE" '.version == $v and .bundle.android.versionCode == $c' src-tauri/tauri.conf.json

      - run: pnpm build

      - name: Build Android
        run: pnpm tauri android build

      # ----------------------
      # artifact
      # ----------------------
      - uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ inputs.version || github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
