name: WebBuild

# main への push は開発版の :main を、Release workflow からの呼び出しは :<version> と :latest を作る。
on:
  push:
    branches: [ 'main' ]
  workflow_call:
    inputs:
      version:
        type: string
        required: true

# 呼び出し時の github.ref は呼び出し元(main)になるので、main の push と取り合わないよう version で分ける
concurrency:
  group: web-build-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: concrnt/world-app

jobs:
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ !inputs.version }}
            type=raw,value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version }}

  build:
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        arch:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.arch }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      # 設定画面の version は unplugin-info が web/package.json から読む。release ブランチのスナップショットと同じ値を書き込む
      - name: Stamp version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' web/package.json > web/package.json.tmp
          mv web/package.json.tmp web/package.json

      - name: Build
        env:
          CONCRNT_DEV_BUILD: ${{ inputs.version && '0' || '1' }}
        run: pnpm build

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # apt/ca-certificates layer must be rebuilt every time (eMudhra 2026-10 lesson)
          no-cache-filters: runtime
          build-args: VERSION=${{ inputs.version && format('v{0}', inputs.version) || 'main' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          docker buildx imagetools create $(printf -- '-t %s ' $TAGS) \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker buildx imagetools inspect "$t"
          done
