[package]
name = "world-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[workspace]
members = [".", "crates/concrnt"]
resolver = "2"

# Xcode 27's SwiftPM internalizes non-public @_cdecl symbols; swift-rs 1.0.8
# re-globalizes its own package's symbols but misses the ones exported by its
# SwiftRs Swift dependency (retain_object etc.), so iOS release links fail.
# The fork carries a one-line fix in src-rs/build.rs. Drop this patch once
# upstream ships a release that links on Xcode 27 (Brendonovich/swift-rs).
# Building also requires rustup's llvm-tools component (llvm-objcopy).
[patch.crates-io]
swift-rs = { git = "https://github.com/totegamma/swift-rs", branch = "fix/xcode27-swiftrs-cdecl" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "world_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
concrnt = { path = "crates/concrnt" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
tauri-plugin-keychain = { version = "2.0.2", path = "../plugins/tauri-plugin-keychain" }
tauri-plugin-barcode-scanner = { version = "2.4.5" }
tauri-plugin-haptics = "2"
tauri-plugin-file-saver = { version = "0.1.0", path = "../plugins/tauri-plugin-file-saver" }
tauri-plugin-share = { version = "0.1.0", path = "../plugins/tauri-plugin-share" }
tauri-plugin-keyboard = { version = "0.1.0", path = "../plugins/tauri-plugin-keyboard" }
tauri-plugin-push = { version = "0.1.0", path = "../plugins/tauri-plugin-push" }
tauri-plugin-scroll-killer = { version = "0.1.0", path = "../plugins/tauri-plugin-scroll-killer" }

[target.'cfg(any(target_os = "ios"))'.dependencies]
tauri-plugin-ageverify = { version = "0.1.0", path = "../plugins/tauri-plugin-ageverify" }
